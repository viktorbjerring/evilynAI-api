get:
  summary: Retrieve logs from a named source
  description: |
    Reads from the rotating log file associated with a named log source.
    Sources are registered internally at startup.

    Known sources: `AI`, `tools`.
  tags: [health]
  security:
    - bearerAuth: []
  parameters:
    - name: source_name
      in: path
      required: true
      schema:
        type: string
        example: "AI"
      description: Log source identifier
  responses:
    '200':
      description: Log lines
      content:
        application/json:
          schema:
            type: object
            required: [logs]
            properties:
              logs:
                type: array
                items:
                  type: string
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
    '404':
      description: Unknown log source
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
    '500':
      description: Error reading log file
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string

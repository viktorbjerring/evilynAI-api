post:
  summary: Force memory extraction to long-term storage
  description: |
    Manually triggers the extraction pipeline that normally fires after a
    threshold of summaries accumulates. Traits and facts are extracted from
    the summaries and persisted to long-term (vector) memory.
  tags: [debug]
  security:
    - bearerAuth: []
  responses:
    '200':
      description: Extraction completed
      content:
        application/json:
          schema:
            type: object
            required: [status, conversation_count]
            properties:
              status:
                type: string
                example: "extracted"
              conversation_count:
                type: integer
                description: Total number of conversations processed so far
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string

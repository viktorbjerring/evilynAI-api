get:
  summary: Get the admin chat transcript (projects module)
  description: |
    Module admin route on the `projects` module. Returns the full admin-chat
    transcript, oldest first — one entry per message (user or assistant), each
    with its UTC timestamp. Empty before the first message. Read-only.
  tags: [module-admin]
  security:
    - bearerAuth: []
  responses:
    '200':
      description: The chat transcript
      content:
        application/json:
          schema:
            type: object
            required: [transcript]
            properties:
              transcript:
                type: array
                items:
                  type: object
                  required: [role, content, timestamp]
                  properties:
                    role:
                      type: string
                      enum: [user, assistant]
                    content:
                      type: string
                    timestamp:
                      type: string
                      format: date-time
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string

get:
  summary: calendar module details
  description: |
    Module root for the `calendar` module. Reports the hybrid backend's
    runtime state: whether a Google OAuth token is present, the depth of
    the local write queue, the calendar IDs configured for sync, and the
    size of the local event store.
  tags: [module-admin]
  security:
    - bearerAuth: []
  responses:
    '200':
      description: Module details
      content:
        application/json:
          schema:
            type: object
            required: [name, details]
            properties:
              name:
                type: string
                example: calendar
              details:
                type: object
                required:
                  [authenticated, pending_operations, calendar_ids, local_events]
                properties:
                  authenticated:
                    type: boolean
                    description: True if a Google OAuth token is present on disk.
                  pending_operations:
                    type: integer
                    description: Number of offline-queued writes awaiting replay.
                  calendar_ids:
                    type: array
                    items:
                      type: string
                    description: Calendar IDs included in the daily sync.
                  local_events:
                    type: integer
                    description: Events currently held in the local store.
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string

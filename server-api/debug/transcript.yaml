get:
  summary: View current transcript buffer
  description: |
    Returns the in-memory short-term transcript. Each entry includes all
    roles recorded by the inference engine, including tool turns.
  tags: [debug]
  security:
    - bearerAuth: []
  responses:
    '200':
      description: Transcript state
      content:
        application/json:
          schema:
            type: object
            required: [messages]
            properties:
              messages:
                type: array
                items:
                  type: object
                  required: [role, content]
                  properties:
                    role:
                      type: string
                      enum: [user, assistant, system, tool_call, tool_result]
                    content:
                      type: string
                    timestamp:
                      type: string
                      format: date-time
                      nullable: true
                    feedback_flag:
                      type: boolean
                      nullable: true
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string

get:
  summary: Get the server scheduler's summary
  description: |
    A scheduler-wide summary across every server schedule. The top-level
    fields keep the shape the old single nightly scheduler reported, now
    computed across schedules; `schedules` and `dream_scheduled` are new, and
    the old `schedule` string (`"03:00"`) is gone with the settings it
    described. All timestamps are UTC.

    `dream_scheduled` is `false` when no enabled, armed schedule has a `dream`
    step. Pausing or deleting the dream is allowed, but it is the one
    configuration that silently stops memory consolidation, so it is surfaced
    here rather than left to be noticed weeks later.

    Degrades to an all-empty summary (`enabled: false`, `schedules: []`) when
    no scheduler is wired.
  tags: [debug]
  security:
    - bearerAuth: []
  responses:
    '200':
      description: Scheduler summary
      content:
        application/json:
          schema:
            type: object
            required:
              - enabled
              - running
              - in_flight
              - next_run
              - last_run
              - last_result
              - dream_scheduled
              - schedules
            properties:
              enabled:
                type: boolean
                description: True if any schedule is enabled and armed.
              running:
                type: boolean
                description: True if the scheduler's timer thread is alive.
              in_flight:
                type: boolean
                description: True if any schedule has a run executing.
              next_run:
                type: string
                format: date-time
                nullable: true
                description: The soonest next run across all schedules (UTC).
              last_run:
                type: string
                format: date-time
                nullable: true
                description: Start of the most recent run of any schedule (UTC).
              last_result:
                type: object
                nullable: true
                description: The most recent run in full.
                allOf:
                  - $ref: '../../openapi.yaml#/components/schemas/ScheduleRun'
              dream_scheduled:
                type: boolean
              schedules:
                type: array
                description: Every schedule, soonest next run first.
                items:
                  type: object
                  required: [id, label, enabled, next_run, last_status]
                  properties:
                    id:
                      type: string
                    label:
                      type: string
                    enabled:
                      type: boolean
                    next_run:
                      type: string
                      format: date-time
                      nullable: true
                    last_status:
                      type: string
                      nullable: true
                      enum: [ok, partial, error, null]
    '401':
      $ref: '../../openapi.yaml#/components/responses/Unauthorized'

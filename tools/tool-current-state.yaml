get:
  summary: Get a tool's current runtime state
  description: |
    Returns the tool's internal state as reported by `tool_state`.
    This returns a tool-agnostic dictionary containing if the tool is enabled, and the tools description

    Example uses:
    - Scheduler: list of active scheduled jobs
    - Notebook: list of notes on disk
    - Tasks: cached task list from Google Tasks
  tags: [tools]
  security:
    - bearerAuth: []
  parameters:
    - name: tool_name
      in: path
      required: true
      schema:
        type: string
        example: "scheduler"
  responses:
    '200':
      description: Tool state
      content:
        application/json:
          schema:
            type: object
            required: [tool, state]
            properties:
              tool:
                type: string
              state:
                type: object
                description: Tool-specific state object
                properties:
                  enabled:
                    type: boolean
                    description: Whether the tool is enabled
                  description:
                    type: string
                    description: Human-readable description of the tool
                required:
                  - enabled
                additionalProperties: {} 
          example:
            tool: "scheduler"
            state:
              enabled: true
              description: "Runs scheduled jobs"
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
    '404':
      description: Tool not found
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string

post:
  summary: Clear the admin chat (projects module)
  description: |
    Module admin route on the `projects` module. Wipes the admin-chat
    transcript so the next chat starts from a clean slate. Idempotent — clearing
    an already-empty chat succeeds. Returns the (now empty) transcript. This
    only clears the conversation history; it does not touch any project files
    the chat previously created or edited.
  tags: [module-admin]
  security:
    - bearerAuth: []
  responses:
    '200':
      description: The chat was cleared
      content:
        application/json:
          schema:
            type: object
            required: [status, transcript]
            properties:
              status:
                type: string
                enum: [cleared]
              transcript:
                type: array
                items:
                  type: object
                description: Always empty after a clear.
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string

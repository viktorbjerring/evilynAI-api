get:
  summary: web_fetch module details
  description: |
    Module root for the `web_fetch` module, which reduces a link attached to a
    user message to readable text. It has no other admin routes: links arrive
    through `POST /chat` as attachments, never here.

    Extraction runs in two passes — an algorithmic readability pass, then an
    LLM pass when the first comes back below `min_extracted_chars` or above
    `max_link_ratio`. `fallback_available` reports whether the second pass is
    configured; without it a thin extraction is returned with a caveat rather
    than recovered.

    Links are screened before every request, and again on every redirect
    hop: only globally routable addresses are fetched, so a link pointing (or
    redirecting) at loopback, an RFC1918 range, or a link-local address such as
    a cloud metadata endpoint is refused.

    `pending` lists the references currently waiting to be read — a link is
    pre-warmed when the message carrying it is posted and discarded when that
    run ends, so outside a live turn this is normally empty.
  tags: [module-admin]
  security:
    - bearerAuth: []
  responses:
    '200':
      description: Module details
      content:
        application/json:
          schema:
            type: object
            required: [name, details]
            properties:
              name:
                type: string
                example: web_fetch
              details:
                type: object
                properties:
                  fallback_model:
                    type: string
                    nullable: true
                    description: Model used for the LLM extraction pass, if configured.
                  fallback_available:
                    type: boolean
                  timeout_seconds:
                    type: number
                  max_bytes:
                    type: integer
                    description: Ceiling on the fetched body before it is cut.
                  max_chars:
                    type: integer
                    description: Ceiling on the returned text.
                  min_extracted_chars:
                    type: integer
                    description: >
                      Below this many characters the algorithmic pass counts as
                      insufficient and the LLM fallback runs.
                  max_link_ratio:
                    type: number
                    description: >
                      Above this share of anchor text the page reads as
                      navigation, and the LLM fallback runs.
                  max_redirects:
                    type: integer
                    description: >
                      How many redirect hops are followed. Each hop is screened
                      independently before it is requested.
                  pending:
                    type: array
                    items:
                      type: string
                    description: References of links currently pre-warmed.
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string

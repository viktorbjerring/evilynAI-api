get:
  summary: View current long-term memory working set
  description: |
    Returns the in-process working set of retrieved long-term memories for
    the current session. Rebuilt on restart via the standard decay → retrieve
    → merge pipeline.
  tags: [debug]
  security:
    - bearerAuth: []
  responses:
    '200':
      description: Working set contents
      content:
        application/json:
          schema:
            type: object
            required: [memories]
            properties:
              memories:
                type: array
                items:
                  type: object
                  required: [memory_id, content, category, confidence, subject, relevance_score]
                  properties:
                    memory_id:
                      type: integer
                    content:
                      type: string
                    category:
                      type: string
                    confidence:
                      type: number
                      format: float
                    subject:
                      type: string
                    relevance_score:
                      type: number
                      format: float
                    source_date:
                      type: string
                      format: date
                      nullable: true
    '401':
      $ref: '../openapi.yaml#/components/responses/Unauthorized'

get:
  summary: Retrieve recent conversation messages
  description: |
    Returns messages from the current in-memory transcript in chronological
    order. The transcript is a rolling buffer; messages older than the buffer
    window are summarized and not returned here.

    Each message carries an `attachments` list — pointers to whatever arrived
    with it, tagged by `type` and fetched through `/attachments`. That is what
    lets a client re-render an old conversation with its pictures still in it.
  tags: [chat]
  security:
    - bearerAuth: []
  parameters:
    - name: limit
      in: query
      required: false
      schema:
        type: integer
        default: 50
        minimum: 1
      description: Maximum number of messages to return (most recent N)
  responses:
    '200':
      description: Message list
      content:
        application/json:
          schema:
            type: object
            required: [messages]
            properties:
              messages:
                type: array
                items:
                  type: object
                  required: [role, content, feedback_flag, attachments]
                  properties:
                    role:
                      type: string
                      enum: [user, assistant, system, tool_call, tool_result, thinking]
                      description: Conversation role of the message.
                    content:
                      description: |
                        Shape depends on `role`:
                        - `user` / `assistant` / `thinking`: a plain string.
                        - `system`: an object `{sender, message}` identifying
                          the originating component and the message body.
                        - `tool_call`: the parsed JSON array of tool calls,
                          each `{name, arguments}`.
                        - `tool_result`: the parsed JSON object `{tool, result}`.
                      oneOf:
                        - type: string
                        - type: object
                          required: [sender, message]
                          properties:
                            sender:
                              type: string
                            message:
                              type: string
                        - type: array
                          items:
                            type: object
                            required: [name, arguments]
                            properties:
                              name:
                                type: string
                              arguments:
                                type: object
                        - type: object
                          required: [tool, result]
                          properties:
                            tool:
                              type: string
                            result:
                              type: string
                    timestamp:
                      type: string
                      format: date-time
                      nullable: true
                    feedback_flag:
                      type: string
                      enum: [undecided, encouraged, discouraged]
                      description: |
                        Reinforcement signal carried on the message. Only
                        assistant messages are ever marked; everything else
                        is `undecided`. Set via `POST /chat/feedback`.
                    attachments:
                      type: array
                      description: |
                        Pointers to what arrived with this message — never
                        payloads. Always present, usually empty. Fetch the
                        bytes from `GET /attachments/{id}/content` and the
                        description from `GET /attachments/{id}`.
                      items:
                        type: object
                        required: [id, type, reference, media_type, url]
                        properties:
                          id:
                            type: string
                            description: Storage id, for the `/attachments` routes.
                            example: "20260824-143502-01"
                          type:
                            type: string
                            enum: [image, link]
                            description: >
                              What this attachment is, so a client can render a
                              link differently from a picture.
                          reference:
                            type: string
                            description: >
                              The short handle Evilyn was offered for it within
                              this message.
                            example: "image-1"
                          media_type:
                            type: string
                            description: MIME type for images; empty for links.
                          url:
                            type: string
                            description: The URL for links; empty for images.
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string

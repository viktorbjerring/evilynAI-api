post:
  summary: Test the Google Tasks backend connection
  description: |
    Module admin route on the `tasks` module. Forces a fresh online client
    build and performs a lightweight live call against Google Tasks to verify
    the backend is reachable, then caches the result.

    The probe itself always completes, so this returns `200` with the
    resulting connection state regardless of outcome — inspect `connected`
    and `error` to tell whether the live backend was reachable. The cached
    state is also surfaced on the module root (`GET /`) and in the tool's
    `tool_state` for health reporting.
  tags: [module-admin]
  security:
    - bearerAuth: []
  responses:
    '200':
      description: Connection probe result
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TasksConnectionState'
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string

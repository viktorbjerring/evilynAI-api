openapi: 3.0.3
info:
  title: EvilynAI API
  version: 1.0.0
  description: |
    REST API for the EvilynAI backend. All endpoints except `/health` and
    `/login` require a Bearer JWT token obtained from `POST /api/login`.

    The SSE stream endpoint (`GET /api/stream`) also accepts the token as a
    `?token=` query parameter, because `EventSource` cannot set custom headers.
servers:
  - url: http://localhost:5000/api
    description: Local development
paths:
  /login:
    post:
      summary: Authenticate and receive a JWT
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - password
              properties:
                password:
                  type: string
                  example: hunter2
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                type: object
                required:
                  - token
                  - expires_in
                properties:
                  token:
                    type: string
                    description: HS256-signed JWT
                  expires_in:
                    type: integer
                    description: Token lifetime in seconds
                    example: 2592000
        '400':
          description: Request body missing
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '401':
          description: Invalid password
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Invalid credentials
        '500':
          description: Authentication not configured
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  /chat:
    post:
      summary: Send a message and receive an AI response
      description: |
        Accepts either JSON (text) or multipart/form-data (audio).

        **Text input:** send `Content-Type: application/json` with a `message` field.

        **Audio input:** send `Content-Type: multipart/form-data` with an `audio` file.
        The file is transcribed server-side via OpenAI Whisper. The transcription is
        returned in `input_transcription`.

        The response may include `audio_url` — a TTS response ID. Fetch the audio
        from `GET /api/tts/fetch/{audio_url}`.
      tags:
        - chat
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - message
              properties:
                message:
                  type: string
                  example: Hey, how are you?
          multipart/form-data:
            schema:
              type: object
              required:
                - audio
              properties:
                audio:
                  type: string
                  format: binary
                  description: Audio file (webm recommended)
      responses:
        '200':
          description: AI response
          content:
            application/json:
              schema:
                type: object
                required:
                  - response
                  - timestamp
                properties:
                  response:
                    type: string
                    description: AI text response
                  timestamp:
                    type: string
                    format: date-time
                  input_transcription:
                    type: string
                    nullable: true
                    description: Whisper transcription (only present for audio input)
                  audio_url:
                    type: string
                    nullable: true
                    description: TTS response ID — fetch audio from GET /tts/fetch/{audio_url}
                  metadata:
                    type: object
                    additionalProperties: true
        '400':
          description: Missing or empty message
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '500':
          description: Internal error during message processing
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  /chat/history:
    get:
      summary: Retrieve recent conversation messages
      description: |
        Returns messages from the current in-memory transcript in chronological
        order. The transcript is a rolling buffer; messages older than the buffer
        window are summarized and not returned here.
      tags:
        - chat
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
            minimum: 1
          description: Maximum number of messages to return (most recent N)
      responses:
        '200':
          description: Message list
          content:
            application/json:
              schema:
                type: object
                required:
                  - messages
                properties:
                  messages:
                    type: array
                    items:
                      type: object
                      properties:
                        role:
                          type: string
                          enum:
                            - user
                            - assistant
                            - system
                        content:
                          type: string
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  /actions/pending:
    get:
      summary: List all pending actions awaiting approval
      tags:
        - actions
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of pending actions
          content:
            application/json:
              schema:
                type: object
                required:
                  - actions
                properties:
                  actions:
                    type: array
                    items:
                      type: object
                      required:
                        - id
                        - tool_name
                        - parameters
                        - created_at
                      properties:
                        id:
                          type: string
                          format: uuid
                        tool_name:
                          type: string
                          example: notebook_write
                        parameters:
                          type: object
                          additionalProperties: true
                        created_at:
                          type: string
                          format: date-time
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  /actions/{action_id}:
    get:
      summary: Get details of a specific action
      tags:
        - actions
      security:
        - bearerAuth: []
      parameters:
        - name: action_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Action details
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - tool_name
                  - parameters
                  - status
                  - created_at
                properties:
                  id:
                    type: string
                    format: uuid
                  tool_name:
                    type: string
                  parameters:
                    type: object
                    additionalProperties: true
                  status:
                    type: string
                    enum:
                      - pending
                      - approved
                      - denied
                      - executed
                      - expired
                      - error
                  created_at:
                    type: string
                    format: date-time
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '404':
          description: Action not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Action not found
  /actions/{action_id}/approve:
    post:
      summary: Approve a pending action
      description: |
        Marks the action as approved and injects a system message into the AI,
        triggering a new inference loop. The AI is then expected to call the
        internal `execute_approved` tool to run the action.

        Returns the AI's response to the approval notification.
      tags:
        - actions
      security:
        - bearerAuth: []
      parameters:
        - name: action_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Action approved and AI notified
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - action_id
                  - response
                properties:
                  status:
                    type: string
                    example: approved
                  action_id:
                    type: string
                    format: uuid
                  response:
                    type: string
                    description: AI response to the approval notification
        '400':
          description: Action is not in pending state
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: 'Action is not pending (status: approved)'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '404':
          description: Action not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  /actions/{action_id}/deny:
    post:
      summary: Deny a pending action
      description: |
        Marks the action as denied and injects a system message into the AI,
        triggering a new inference loop so the AI is aware the action was rejected.
      tags:
        - actions
      security:
        - bearerAuth: []
      parameters:
        - name: action_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Action denied and AI notified
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - action_id
                  - response
                properties:
                  status:
                    type: string
                    example: denied
                  action_id:
                    type: string
                    format: uuid
                  response:
                    type: string
                    description: AI response to the denial notification
        '400':
          description: Action is not in pending state
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '404':
          description: Action not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  /tools:
    get:
      summary: List all registered tools
      description: |
        Returns all tools loaded by the tool registry, including their actions,
        default permissions, descriptions, and debug info.
      tags:
        - tools
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Tool list
          content:
            application/json:
              schema:
                type: object
                required:
                  - tools
                properties:
                  tools:
                    type: array
                    items:
                      type: object
                      required:
                        - name
                        - description
                        - enabled
                        - actions
                      properties:
                        name:
                          type: string
                          example: notebook
                        description:
                          type: string
                        enabled:
                          type: boolean
                        actions:
                          type: array
                          items:
                            type: object
                            properties:
                              name:
                                type: string
                                example: notebook_write
                              action_name:
                                type: string
                              permission:
                                type: string
                                enum:
                                  - immediate
                                  - requires_approval
                                  - disabled
                              description:
                                type: string
                        debug_info:
                          type: object
                          additionalProperties: true
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  /tools/reload:
    post:
      summary: Reload the tool registry
      description: |
        Triggers a full reload of the external Toolset. Useful after updating tool
        code or environment variables without restarting the backend.

        Note: permission overrides are preserved across reloads.
      tags:
        - tools
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Reload successful
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - message
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Tool registry reloaded
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  /tools/{tool_name}/enable:
    post:
      summary: Enable a disabled tool
      description: |
        Re-enables a tool that was previously manually disabled. Returns a 409
        if the tool was disabled due to a setup failure — use `POST /reload`
        to retry setup instead.
      tags:
        - tools
      security:
        - bearerAuth: []
      parameters:
        - name: tool_name
          in: path
          required: true
          schema:
            type: string
            example: notebook
      responses:
        '200':
          description: Tool enabled
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - tool
                  - enabled
                properties:
                  status:
                    type: string
                    example: ok
                  tool:
                    type: string
                  enabled:
                    type: boolean
                    example: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Tool cannot be re-enabled without a reload (setup failed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Tool 'notebook' failed during setup and cannot be re-enabled without a reload().
  /tools/{tool_name}/disable:
    post:
      summary: Disable an active tool
      description: |
        Disables a tool, removing it from the LLM's available tool definitions.
        The tool remains inspectable via the API. The disabled state is persisted
        and survives reloads. Use `POST /{tool_name}/enable` to re-enable.
      tags:
        - tools
      security:
        - bearerAuth: []
      parameters:
        - name: tool_name
          in: path
          required: true
          schema:
            type: string
            example: notebook
      responses:
        '200':
          description: Tool disabled
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - tool
                  - enabled
                properties:
                  status:
                    type: string
                    example: ok
                  tool:
                    type: string
                  enabled:
                    type: boolean
                    example: false
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /tools/{tool_name}:
    get:
      summary: Get full detail for a tool
      description: |
        Returns the tool's metadata, all its actions with their full JSON Schema
        parameter definitions, and the effective permission for each action
        (including any active overrides).
      tags:
        - tools
      security:
        - bearerAuth: []
      parameters:
        - name: tool_name
          in: path
          required: true
          schema:
            type: string
            example: notebook
      responses:
        '200':
          description: Tool detail
          content:
            application/json:
              schema:
                type: object
                required:
                  - name
                  - enabled
                  - actions
                properties:
                  name:
                    type: string
                  description:
                    type: string
                    nullable: true
                  enabled:
                    type: boolean
                    nullable: true
                  actions:
                    type: array
                    items:
                      type: object
                      required:
                        - name
                        - description
                        - permission
                        - overridden
                      properties:
                        name:
                          type: string
                          example: notebook_write
                        description:
                          type: string
                        permission:
                          type: string
                          enum:
                            - immediate
                            - requires_approval
                            - disabled
                          description: Effective permission (default or overridden)
                        overridden:
                          type: boolean
                          description: True if the permission has been manually overridden
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '404':
          description: Tool not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Tool 'unknown_tool' not found
  /tools/{tool_name}/actions:
    get:
      summary: List all actions for a tool with schemas and permissions
      description: |
        Returns each action's full parameter schema alongside its default and
        effective permissions. Useful for building a UI for direct invocation
        or understanding what the AI can call.
      tags:
        - tools
      security:
        - bearerAuth: []
      parameters:
        - name: tool_name
          in: path
          required: true
          schema:
            type: string
            example: notebook
      responses:
        '200':
          description: Action list
          content:
            application/json:
              schema:
                type: object
                required:
                  - tool
                  - actions
                properties:
                  tool:
                    type: string
                  actions:
                    type: array
                    items:
                      type: object
                      required:
                        - name
                        - description
                        - permission
                        - overridden
                      properties:
                        name:
                          type: string
                          example: notebook-write
                        description:
                          type: string
                        permission:
                          type: string
                          enum:
                            - immediate
                            - requires_approval
                            - disabled
                          description: Effective permission
                        overridden:
                          type: boolean
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '404':
          description: Tool not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  /tools/{tool_name}/current_state:
    get:
      summary: Get a tool's current runtime state
      description: |
        Returns the tool's internal state as reported by `get_state()`. The
        structure is tool-specific — tools that don't override `get_state()`
        return an empty object.

        Example uses:
        - Scheduler: list of active scheduled jobs
        - Notebook: list of notes on disk
        - Tasks: cached task list from Google Tasks
      tags:
        - tools
      security:
        - bearerAuth: []
      parameters:
        - name: tool_name
          in: path
          required: true
          schema:
            type: string
            example: scheduler
      responses:
        '200':
          description: Tool state
          content:
            application/json:
              schema:
                type: object
                required:
                  - tool
                  - state
                properties:
                  tool:
                    type: string
                  state:
                    type: object
                    additionalProperties: true
                    description: Tool-specific state dictionary
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '404':
          description: Tool not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  /tools/{tool_name}/details:
    get:
      summary: Get extended detail for a tool
      description: |
        Returns the tool's metadata, actions with permissions, and user-callable
        actions (those that bypass AI inference). Combines the data from
        `GET /{tool_name}` and `GET /{tool_name}/user_action`.
      tags:
        - tools
      security:
        - bearerAuth: []
      parameters:
        - name: tool_name
          in: path
          required: true
          schema:
            type: string
            example: scheduler
      responses:
        '200':
          description: Extended tool detail
          content:
            application/json:
              schema:
                type: object
                required:
                  - tool
                  - details
                properties:
                  tool:
                    type: string
                  details:
                    type: object
                    additionalProperties: true
                    description: Tool-defined details dictionary
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '404':
          description: Tool not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  /tools/{tool_name}/user_action:
    get:
      summary: List user-callable actions for a tool
      description: |
        Returns the actions that a user can invoke directly on this tool,
        bypassing the AI inference loop entirely. Each action includes its name
        and the parameter schema. Tools that don't implement user actions return
        an empty list.

        The available actions and their schemas are defined by each tool's
        `get_user_action()` implementation. Examples:
        - Scheduler: `delete_plan`, `pause_plan`
        - Notebook: `delete_note`
      tags:
        - tools
      security:
        - bearerAuth: []
      parameters:
        - name: tool_name
          in: path
          required: true
          schema:
            type: string
            example: scheduler
      responses:
        '200':
          description: Available user actions
          content:
            application/json:
              schema:
                type: object
                required:
                  - tool
                  - actions
                properties:
                  tool:
                    type: string
                  actions:
                    type: array
                    items:
                      type: object
                      required:
                        - name
                        - parameters
                      properties:
                        name:
                          type: string
                          example: delete_plan
                        parameters:
                          type: object
                          description: JSON Schema for the action's parameters
                          example:
                            type: object
                            properties:
                              plan_id:
                                type: string
                            required:
                              - plan_id
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '404':
          description: Tool not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
    post:
      summary: Execute a user action on a tool directly
      description: |
        Invokes a user-defined action on the tool, bypassing AI inference and
        the action queue. The tool handles the request directly via its
        `do_user_action()` method.

        The response structure is tool-defined — each tool returns its own dict.
      tags:
        - tools
      security:
        - bearerAuth: []
      parameters:
        - name: tool_name
          in: path
          required: true
          schema:
            type: string
            example: scheduler
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - action
              properties:
                action:
                  type: string
                  description: Name of the user action to execute
                  example: delete_plan
                parameters:
                  type: object
                  additionalProperties: true
                  description: Action-specific parameters
                  example:
                    plan_id: abc123
      responses:
        '200':
          description: Action result (tool-defined structure)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Missing action name
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '404':
          description: Tool not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  /tools/{tool_name}/{action_name}/permission:
    post:
      summary: Set a permission override for a specific action
      description: |
        Overrides the default permission for a named action on a tool. The
        override is persisted to `permission_overrides.json` and takes effect
        immediately.

        Use the short action name (e.g. `write`, not `notebook-write`).
      tags:
        - tools
      security:
        - bearerAuth: []
      parameters:
        - name: tool_name
          in: path
          required: true
          schema:
            type: string
            example: notebook
        - name: action_name
          in: path
          required: true
          schema:
            type: string
            example: write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - permission
              properties:
                permission:
                  type: string
                  enum:
                    - immediate
                    - requires_approval
                    - disabled
                  example: immediate
      responses:
        '200':
          description: Override applied
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - tool
                  - action
                  - permission
                properties:
                  status:
                    type: string
                    example: ok
                  tool:
                    type: string
                  action:
                    type: string
                  permission:
                    type: string
                    enum:
                      - immediate
                      - requires_approval
                      - disabled
        '400':
          description: Invalid permission value
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '404':
          description: Tool or action not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
    delete:
      summary: Reset an action's permission to its default
      description: |
        Removes any active override, restoring the action's built-in default
        permission. If no override exists this is a no-op.
      tags:
        - tools
      security:
        - bearerAuth: []
      parameters:
        - name: tool_name
          in: path
          required: true
          schema:
            type: string
            example: notebook
        - name: action_name
          in: path
          required: true
          schema:
            type: string
            example: write
      responses:
        '200':
          description: Override removed (or was not set)
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - tool
                  - action
                properties:
                  status:
                    type: string
                    example: ok
                  tool:
                    type: string
                  action:
                    type: string
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '404':
          description: Tool or action not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  /tts/available:
    get:
      summary: Check TTS availability
      tags:
        - tts
      security:
        - bearerAuth: []
      responses:
        '200':
          description: TTS status
          content:
            application/json:
              schema:
                type: object
                required:
                  - available
                  - expressions
                properties:
                  available:
                    type: boolean
                  expressions:
                    type: array
                    items:
                      type: string
                    example:
                      - neutral
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '500':
          description: TTS engine error
          content:
            application/json:
              schema:
                type: object
                properties:
                  available:
                    type: boolean
                    example: false
                  error:
                    type: string
  /tts/enable:
    post:
      summary: Enable or disable TTS
      tags:
        - tts
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - enabled
              properties:
                enabled:
                  type: boolean
                  description: Set to true to enable TTS, false to disable
      responses:
        '200':
          description: TTS state updated
          content:
            application/json:
              schema:
                type: object
                required:
                  - enabled
                properties:
                  enabled:
                    type: boolean
        '400':
          description: Missing enabled field
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '503':
          description: TTS engine not available
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  /tts/fetch/{response_id}:
    get:
      summary: Fetch generated TTS audio
      description: |
        Returns the MP3 audio for a given TTS response ID. The ID comes from the
        `audio_url` field of a `POST /api/chat` response.

        If the audio is still being generated, a `202` is returned with a
        `retry_after` hint (seconds). Poll again after that interval.
      tags:
        - tts
      security:
        - bearerAuth: []
      parameters:
        - name: response_id
          in: path
          required: true
          schema:
            type: string
          description: TTS response ID from the chat response's `audio_url` field
      responses:
        '200':
          description: Audio file
          content:
            audio/mpeg:
              schema:
                type: string
                format: binary
        '202':
          description: Audio still generating — retry after the suggested interval
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - retry_after
                properties:
                  status:
                    type: string
                    example: generating
                  retry_after:
                    type: integer
                    description: Suggested seconds to wait before retrying
                    example: 1
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '404':
          description: Audio not found or expired
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '500':
          description: TTS generation failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '503':
          description: TTS engine not available
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  /stt/available:
    get:
      summary: Check if STT is available
      description: |
        Returns whether server-side speech-to-text is available. Availability
        depends on `OPENAI_API_KEY` being configured.
      tags:
        - stt
      security:
        - bearerAuth: []
      responses:
        '200':
          description: STT availability status
          content:
            application/json:
              schema:
                type: object
                required:
                  - available
                properties:
                  available:
                    type: boolean
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  /stream:
    get:
      summary: Open SSE event stream
      description: |
        Opens a persistent Server-Sent Events connection. The server pushes events
        as they occur. Keep-alive comments (`: keep-alive`) are sent every 5 seconds
        to prevent proxy/browser timeouts.

        **Authentication:** Accepts a Bearer token via `Authorization` header **or**
        via `?token=` query parameter (required for browser `EventSource`).

        Each SSE event has the form:
        ```
        event: <type>
        data: <JSON payload>
        ```
      tags:
        - stream
      security:
        - bearerAuth: []
      parameters:
        - name: token
          in: query
          required: false
          schema:
            type: string
          description: JWT token (alternative to Authorization header, for EventSource)
      responses:
        '200':
          description: SSE stream opened
          content:
            text/event-stream:
              schema:
                type: string
                description: Stream of SSE events
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  /device/register:
    post:
      summary: Register an FCM device token
      description: |
        Registers a Firebase Cloud Messaging token for push notification fallback.
        When no SSE client is connected, certain events are delivered via FCM to
        all registered devices.

        Tokens are persisted to `fcm_devices.json`. Stale tokens are pruned
        automatically after failed delivery attempts.
      tags:
        - stream
      security:
        - bearerAuth: []
      parameters:
        - name: token
          in: query
          required: false
          schema:
            type: string
          description: JWT token (alternative to Authorization header)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - fcm_token
                - platform
              properties:
                fcm_token:
                  type: string
                  description: FCM registration token from the client SDK
                platform:
                  type: string
                  enum:
                    - android
                    - ios
                    - web
                  description: Device platform
      responses:
        '200':
          description: Device registered
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - platform
                properties:
                  status:
                    type: string
                    example: ok
                  platform:
                    type: string
        '400':
          description: Missing or invalid fields
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  /debug/transcript:
    get:
      summary: View current transcript buffer
      description: |
        Returns the in-memory transcript with token usage info and whether a
        rotation is due. Rotation happens when the buffer reaches ~80% of the token
        budget; the oldest 50% is summarized.
      tags:
        - debug
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Transcript state
          content:
            application/json:
              schema:
                type: object
                required:
                  - messages
                  - token_count
                  - should_rotate
                properties:
                  messages:
                    type: array
                    items:
                      type: object
                      properties:
                        role:
                          type: string
                          enum:
                            - user
                            - assistant
                            - system
                        content:
                          type: string
                  token_count:
                    type: string
                    description: Token usage summary (e.g. "1200 / 3500")
                  should_rotate:
                    type: boolean
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  /debug/summaries:
    get:
      summary: View summaries window and meta-summary
      description: |
        Returns the short-term summary window (up to 4 recent summaries), the
        current meta-summary, and whether long-term extraction is due.
      tags:
        - debug
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Summaries state
          content:
            application/json:
              schema:
                type: object
                required:
                  - summaries
                  - count
                  - meta_summary
                  - should_extract
                properties:
                  summaries:
                    type: array
                    items:
                      type: string
                  count:
                    type: string
                    description: Fresh / total summaries (e.g. '3 / 4')
                  meta_summary:
                    type: string
                    description: Synthesized summary of the summary window
                  should_extract:
                    type: boolean
                    description: True if extraction to long-term memory is due
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  /debug/personality:
    get:
      summary: View core memory personality traits
      description: |
        Returns the full CoreMemory contents — personality traits, relationship
        dynamics, and metadata. This is the persistent personality layer that
        survives backend restarts.
      tags:
        - debug
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Personality traits
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                description: |
                  Dynamic structure containing trait sections (e.g. personality,
                  relationship) and metadata (e.g. conversations_count).
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  /debug/trait:
    get:
      summary: Get all trait categories and subcategories.
      description: |
        Retrieve a structured list of all available trait categories and their
        corresponding subcategories. Useful for understanding the organization of
        traits within the personality model and for debugging trait management.
      tags:
        - debug
      security:
        - bearerAuth: []
      responses:
        '200':
          description: A JSON object containing trait categories and subcategories
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: array
                  items:
                    type: string
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
    post:
      summary: Inject a trait directly into CoreMemory
      description: |
        Bypasses the extraction pipeline and adds a trait directly to the
        persistent CoreMemory store. Useful for seeding personality state during
        development or testing.
      tags:
        - debug
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - section
                - category
                - content
              properties:
                section:
                  type: string
                  description: Top-level personality section (e.g. "personality", "relationship")
                  example: personality
                category:
                  type: string
                  description: Subcategory within the section
                  example: humor
                content:
                  type: string
                  description: Trait content / description
                  example: Has a dry, deadpan sense of humor
                confidence:
                  type: number
                  format: float
                  minimum: 0
                  maximum: 1
                  default: 0.5
                  description: Confidence score for the trait
      responses:
        '200':
          description: Trait added
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - trait
                properties:
                  status:
                    type: string
                    example: trait added
                  trait:
                    type: object
                    additionalProperties: true
        '400':
          description: Missing required fields or invalid section
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  /debug/force-rotation:
    post:
      summary: Force a transcript rotation
      description: |
        Manually triggers the transcript rotation that normally fires when the
        buffer is ~80% full. The oldest 50% of messages are summarized and moved
        into the summaries window.

        Returns an error if the transcript is empty.
      tags:
        - debug
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Rotation completed
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - summaries_count
                  - meta_summary
                properties:
                  status:
                    type: string
                    example: rotated
                  summaries_count:
                    type: integer
                  meta_summary:
                    type: string
        '400':
          description: Transcript is empty
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: No messages to rotate
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  /debug/force-extraction:
    post:
      summary: Force memory extraction to long-term storage
      description: |
        Manually triggers the extraction pipeline that normally fires after a
        threshold of summaries accumulates. Traits and facts are extracted from
        the summaries and persisted to long-term (vector) memory.
      tags:
        - debug
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Extraction completed
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - conversation_count
                properties:
                  status:
                    type: string
                    example: extracted
                  conversation_count:
                    type: integer
                    description: Total number of conversations processed so far
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  /system/ping:
    get:
      summary: System health ping
      description: Simple liveness check for the system blueprint.
      tags:
        - system
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Service is alive
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - message
                properties:
                  status:
                    type: string
                    example: ok
                  message:
                    type: string
                    example: pong
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  /system/notificator:
    post:
      summary: Broadcast an FCM push notification
      description: |
        Broadcasts a push notification to all registered FCM devices. Used by
        the toolset notificator module to surface alerts outside of the SSE stream.
      tags:
        - system
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
                - message
              properties:
                title:
                  type: string
                  description: Notification title
                  example: Meeting Reminder
                message:
                  type: string
                  description: Notification body
                  example: Your meeting starts in 10 minutes.
      responses:
        '200':
          description: Notification sent
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - message
                properties:
                  status:
                    type: string
                    example: ok
                  message:
                    type: string
                    example: Notification sent
        '400':
          description: Missing title or message
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  /system/message:
    post:
      summary: Inject a system message into the AI
      description: |
        Sends an arbitrary system-role message to the AI and triggers inference.
        Used by external tools and automation to surface events directly into the
        conversation context.
      tags:
        - system
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - message
              properties:
                message:
                  type: string
                  description: The system message to inject
                  example: 'Reminder: your meeting starts in 10 minutes.'
      responses:
        '200':
          description: Message injected and AI responded
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - response
                properties:
                  status:
                    type: string
                    example: success
                  response:
                    type: string
                    description: AI response text
        '400':
          description: Missing message field
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  /health:
    get:
      summary: Service health check
      description: |
        Returns the service status and availability of optional subsystems (TTS, STT).
        No authentication required.
      tags:
        - health
      responses:
        '200':
          description: Health status
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - tts
                  - stt
                properties:
                  status:
                    type: string
                    example: ok
                  tts:
                    type: boolean
                    description: Whether the TTS engine is available
                  stt:
                    type: boolean
                    description: Whether STT (Whisper) is configured
  /logs/{source_name}:
    get:
      summary: Retrieve logs from a named source
      description: |
        Reads from the rotating log file associated with a named log source.
        Sources are registered internally at startup.

        Known sources: `AI`, `tools`.
      tags:
        - health
      security:
        - bearerAuth: []
      parameters:
        - name: source_name
          in: path
          required: true
          schema:
            type: string
            example: AI
          description: Log source identifier
      responses:
        '200':
          description: Log lines
          content:
            application/json:
              schema:
                type: object
                required:
                  - logs
                properties:
                  logs:
                    type: array
                    items:
                      type: string
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '404':
          description: Unknown log source
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '500':
          description: Error reading log file
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  /auth/google/{tool_name}:
    get:
      summary: Initiate Google OAuth flow for a tool
      description: |
        Starts the OAuth 2.0 authorization code flow for the named Google tool.
        Redirects the browser to the Google consent screen.

        The tool must expose `credentials_path` and `google_scopes` in its
        `debug_info`. After the user approves, Google redirects to the callback
        endpoint.
      tags:
        - google-auth
      security:
        - bearerAuth: []
      parameters:
        - name: tool_name
          in: path
          required: true
          schema:
            type: string
            example: tasks
          description: Name of the Google tool to re-authorize
        - name: token
          in: query
          required: false
          schema:
            type: string
          description: JWT token (alternative to Authorization header)
      responses:
        '302':
          description: Redirect to Google consent screen
          headers:
            Location:
              schema:
                type: string
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '404':
          description: Tool not found
          content:
            text/plain:
              schema:
                type: string
        '500':
          description: Missing credentials file or OAuth setup error
          content:
            text/plain:
              schema:
                type: string
  /auth/google/{tool_name}/callback:
    get:
      summary: OAuth redirect callback
      description: |
        Handles the redirect from Google after the user approves (or denies) access.
        Not called directly — Google redirects here after the consent screen.

        On success:
        - Exchanges the authorization code for credentials
        - Writes the token to disk
        - Reloads the toolset so the tool picks up the new token
        - Returns an HTML success page

        On denial:
        - Returns an HTML page indicating the authorization was denied

        On state mismatch (CSRF):
        - Returns 400
      tags:
        - google-auth
      parameters:
        - name: tool_name
          in: path
          required: true
          schema:
            type: string
        - name: code
          in: query
          required: false
          schema:
            type: string
          description: Authorization code from Google
        - name: state
          in: query
          required: false
          schema:
            type: string
          description: CSRF state token
        - name: error
          in: query
          required: false
          schema:
            type: string
          description: Error code if the user denied access
      responses:
        '200':
          description: Authorization result page (HTML)
          content:
            text/html:
              schema:
                type: string
        '400':
          description: OAuth state mismatch (possible CSRF)
          content:
            text/plain:
              schema:
                type: string
        '404':
          description: Tool not found
          content:
            text/plain:
              schema:
                type: string
        '500':
          description: Token exchange or toolset reload failed
          content:
            text/plain:
              schema:
                type: string
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          example: Action not found
    ActionStatus:
      type: string
      enum:
        - pending
        - approved
        - denied
        - executed
        - expired
        - error
    ActionPermission:
      type: string
      enum:
        - immediate
        - requires_approval
        - disabled
    QueuedAction:
      type: object
      required:
        - id
        - tool_name
        - parameters
        - created_at
      properties:
        id:
          type: string
          format: uuid
        tool_name:
          type: string
        parameters:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/ActionStatus'
  responses:
    Unauthorized:
      description: Missing or invalid JWT token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Missing token
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      description: Invalid or missing request body
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

openapi: "3.0.3"

info:
  title: EvilynAI API
  version: "1.0.0"
  description: |
    REST API for the EvilynAI backend. All endpoints except `/health` and
    `/auth/login` require a Bearer JWT token obtained from `POST /api/auth/login`.

    The SSE stream endpoint (`GET /api/stream`) also accepts the token as a
    `?token=` query parameter, because `EventSource` cannot set custom headers.

servers:
  - url: http://localhost:5000/api
    description: Local development

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          example: "Action not found"

    ActionStatus:
      type: string
      enum: [pending, approved, denied, executed, expired, error]

    ActionPermission:
      type: string
      enum: [immediate, requires_approval, disabled]

    QueuedAction:
      type: object
      required: [id, tool_name, parameters, created_at]
      properties:
        id:
          type: string
          format: uuid
        tool_name:
          type: string
        parameters:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/ActionStatus'

  responses:
    Unauthorized:
      description: Missing or invalid JWT token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: "Missing token"

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    BadRequest:
      description: Invalid or missing request body
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

paths:
  # Auth
  /auth/login:
    $ref: './auth/login.yaml'

  # Chat
  /chat:
    $ref: './chat/chat.yaml'
  /chat/history:
    $ref: './chat/history.yaml'

  # Actions
  /actions:
    $ref: './actions/pending.yaml'
  /actions/{action_id}:
    $ref: './actions/get.yaml'
  /actions/{action_id}/approve:
    $ref: './actions/approve.yaml'
  /actions/{action_id}/deny:
    $ref: './actions/deny.yaml'

  # Tools
  /tools:
    $ref: './tools/list.yaml'
  /tools/permissions:
    $ref: './tools/permissions.yaml'
  /tools/{tool_name}:
    $ref: './tools/get.yaml'
  /tools/{tool_name}/enable:
    $ref: './tools/tool-enable.yaml'
  /tools/{tool_name}/disable:
    $ref: './tools/tool-disable.yaml'

  # Module admin (proxied per-tool under /tools/{tool}/module).
  # Each module defines its own routes; the server proxies them and enforces
  # auth. Concrete routes for the stateful modules are documented below.
  /tools/schedule/module/schedules:
    $ref: './tools/module/schedule-schedules.yaml'
  /tools/schedule/module/schedules/{schedule_id}:
    $ref: './tools/module/schedule-schedule.yaml'
  /tools/schedule/module/schedules/{schedule_id}/trigger:
    $ref: './tools/module/schedule-trigger.yaml'
  /tools/tasks/module/status:
    $ref: './tools/module/tasks-status.yaml'
  /tools/tasks/module/lists:
    $ref: './tools/module/tasks-lists.yaml'
  /tools/tasks/module/tasks:
    $ref: './tools/module/tasks-tasks.yaml'
  /tools/tasks/module/tasks/{task_id}:
    $ref: './tools/module/tasks-task.yaml'

  # TTS
  /tts/available:
    $ref: './tts/available.yaml'
  /tts/enable:
    $ref: './tts/enable.yaml'
  /tts/fetch/{response_id}:
    $ref: './tts/fetch.yaml'

  # STT
  /stt/available:
    $ref: './stt/available.yaml'

  # Stream
  /stream:
    $ref: './stream/stream.yaml'

  # Notifications (FCM push fallback)
  /notifications/register:
    $ref: './notifications/register.yaml'
  /notifications/unregister:
    $ref: './notifications/unregister.yaml'

  # Admin
  /admin/dream/trigger:
    $ref: './admin/dream-trigger.yaml'
  /admin/transcript/rotate:
    $ref: './admin/transcript-rotate.yaml'

  # Debug
  /debug/transcript:
    $ref: './debug/transcript.yaml'
  /debug/working-set:
    $ref: './debug/working-set.yaml'
  /debug/dream/status:
    $ref: './debug/dream-status.yaml'
  /debug/scheduler/status:
    $ref: './debug/scheduler-status.yaml'
  /debug/personality:
    $ref: './debug/personality.yaml'
  /debug/logs/{source_name}:
    $ref: './health/logs.yaml'

  # Health (mounted at the server root, outside the /api base)
  /health:
    $ref: './health/health.yaml'

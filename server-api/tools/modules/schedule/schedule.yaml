# schedule module — paths fragment.
#
# Maps each URL suffix (relative to `/tools/schedule/module/`) to its
# PathItem file. The build step (`make build-tools-module`) collects every
# `<module>.yaml` here and emits the top-level `tools-module.yaml` that
# `openapi.yaml` references.
#
# To add an endpoint: drop a new PathItem file alongside, then add a
# `<suffix>: { $ref: ./<file>.yaml }` entry below.

'':
  $ref: './schedule-details.yaml'
schedules:
  $ref: './schedule-schedules.yaml'
'schedules/{schedule_id}':
  $ref: './schedule-schedule.yaml'
'schedules/{schedule_id}/trigger':
  $ref: './schedule-trigger.yaml'

get:
  summary: Initiate Google OAuth flow for a tool
  description: |
    Starts the OAuth 2.0 authorization code flow for the named Google tool.
    Redirects the browser to the Google consent screen.

    The tool must expose `credentials_path` and `google_scopes` in its
    `debug_info`. After the user approves, Google redirects to the callback
    endpoint.
  tags: [google-auth]
  security:
    - bearerAuth: []
  parameters:
    - name: tool_name
      in: path
      required: true
      schema:
        type: string
        example: "tasks"
      description: Name of the Google tool to re-authorize
    - name: token
      in: query
      required: false
      schema:
        type: string
      description: JWT token (alternative to Authorization header)
  responses:
    '302':
      description: Redirect to Google consent screen
      headers:
        Location:
          schema:
            type: string
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
    '404':
      description: Tool not found
      content:
        text/plain:
          schema:
            type: string
    '500':
      description: Missing credentials file or OAuth setup error
      content:
        text/plain:
          schema:
            type: string

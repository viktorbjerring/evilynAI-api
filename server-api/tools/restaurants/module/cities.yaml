get:
  summary: List cities
  description: |
    Every city with its country, aliases and entry count.
  tags:
  - module-admin
  security:
  - bearerAuth: []
  responses:
    '200':
      description: The city table.
      content:
        application/json:
          schema:
            type: object
            required:
            - cities
            properties:
              cities:
                type: array
                items:
                  $ref: ../../../openapi.yaml#/components/schemas/RestaurantCity
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
post:
  summary: Add a city
  description: |
    Add a city with its country and optional aliases (other spellings that resolve
    to it on input, e.g. `Århus` for `Aarhus`). A name or alias already used by
    another city — as its name or one of its aliases — is a 409.
  tags:
  - module-admin
  security:
  - bearerAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
          - name
          - country
          properties:
            name:
              type: string
            country:
              type: string
            aliases:
              type: array
              items:
                type: string
  responses:
    '201':
      description: Created.
      content:
        application/json:
          schema:
            $ref: ../../../openapi.yaml#/components/schemas/RestaurantCity
    '400':
      description: Validation failed; every problem is listed.
      content:
        application/json:
          schema:
            $ref: ../../../openapi.yaml#/components/schemas/RestaurantValidationErrors
    '409':
      description: Name or alias already taken
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string

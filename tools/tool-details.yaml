get:
  summary: Get extended detail for a tool
  description: |
    Returns extended tool detail as reported by tool.details.
    This returns a tool-specific dictionary of details,
    and is intended to be used for tools to expose additional information about themselves for display in the UI or for other informational purposes.
    This is primarily intended to be used for tools to expose additional information to show in UI, bypassing the AI.

    Example:
    - Scheduler: list of active scheduled jobs with their next run time
    - Notebook: list of notes with their creation date and a short preview of their content
  tags: [tools]
  security:
    - bearerAuth: []
  parameters:
    - name: tool_name
      in: path
      required: true
      schema:
        type: string
        example: "scheduler"
  responses:
    '200':
      description: Extended tool detail
      content:
        application/json:
          schema:
            type: object
            required: [tool, details]
            properties:
              tool:
                type: string
              details:
                type: object
                additionalProperties: true
                description: Tool-defined details dictionary
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
    '404':
      description: Tool not found
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string

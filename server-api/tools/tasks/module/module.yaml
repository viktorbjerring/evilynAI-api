get:
  summary: tasks module details
  description: |
    Module root for the `tasks` module. Reports the hybrid backend's
    runtime state: whether a Google OAuth token is present, and the depth
    of the local write queue (pending operations awaiting replay against
    the online backend) — plus a summary of the reminder machinery (see
    `GET /tools/tasks/module/nags` for the detail).
  tags: [module-admin]
  security:
    - bearerAuth: []
  responses:
    '200':
      description: Module details
      content:
        application/json:
          schema:
            type: object
            required: [name, details]
            properties:
              name:
                type: string
                example: tasks
              details:
                type: object
                required: [authenticated, pending_operations, connection]
                properties:
                  authenticated:
                    type: boolean
                    description: True if a Google OAuth token is present on disk.
                  pending_operations:
                    type: integer
                    description: Number of offline-queued writes awaiting replay.
                  failed_operations:
                    type: integer
                    description: Offline writes Google permanently rejected, awaiting correction.
                  connection:
                    description: Last known backend connection state.
                    $ref: '../../../openapi.yaml#/components/schemas/TasksConnectionState'
                  armed_reminders:
                    type: integer
                    description: Initial task reminders currently scheduled.
                  tasks_in_nag_cycle:
                    type: integer
                    description: Open tasks Evilyn has nagged about at least once.
                  next_nag_at:
                    type: string
                    format: date-time
                    nullable: true
                    description: The earliest moment any task is next owed a nag (UTC).
                  delete_completed_after_days:
                    type: number
                    nullable: true
                    description: |
                      Configured retention for completed tasks (see
                      `POST /tools/tasks/module/cleanup`); null when off.
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string

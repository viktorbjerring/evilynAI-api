post:
  summary: Register an FCM device token
  description: |
    Registers a Firebase Cloud Messaging token for push notification fallback.
    When no SSE client is connected, certain events are delivered via FCM to
    all registered devices.
  tags: [notifications]
  security:
    - bearerAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required: [fcm_token, platform]
          properties:
            fcm_token:
              type: string
              description: FCM registration token from the client SDK
            platform:
              type: string
              enum: [android, ios, web]
              description: Device platform
  responses:
    '200':
      description: Device registered
      content:
        application/json:
          schema:
            type: object
            required: [status, platform]
            properties:
              status:
                type: string
                example: "ok"
              platform:
                type: string
    '400':
      description: Missing or invalid fields
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string

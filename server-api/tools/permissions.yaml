get:
  summary: List active permission overrides
  description: |
    Returns every action that currently has a non-default permission override.
    Actions left at their built-in default are omitted.
  tags: [tools]
  security:
    - bearerAuth: []
  responses:
    '200':
      description: Snapshot of overridden actions
      content:
        application/json:
          schema:
            type: object
            required: [overrides]
            properties:
              overrides:
                type: array
                items:
                  type: object
                  required: [tool, action, default, permission]
                  properties:
                    tool:
                      type: string
                      example: "notebook"
                    action:
                      type: string
                      example: "write"
                    default:
                      type: string
                      enum: [immediate, requires_approval, disabled]
                    permission:
                      type: string
                      enum: [immediate, requires_approval, disabled]
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string

post:
  summary: Set or clear a permission override on a single action
  description: |
    Overrides the permission for one action on a tool. Pass `permission: null`
    to clear an existing override and restore the action's built-in default.

    Use the short action name (e.g. `write`).
  tags: [tools]
  security:
    - bearerAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required: [tool, action]
          properties:
            tool:
              type: string
              example: "notebook"
            action:
              type: string
              example: "write"
            permission:
              type: string
              nullable: true
              enum: [immediate, requires_approval, disabled, null]
              description: New permission, or `null` to clear the override
              example: "immediate"
  responses:
    '200':
      description: Override applied (or cleared)
      content:
        application/json:
          schema:
            type: object
            required: [tool, action, permission]
            properties:
              tool:
                type: string
              action:
                type: string
              permission:
                type: string
                enum: [immediate, requires_approval, disabled]
    '400':
      description: Missing tool/action or invalid permission value
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
    '404':
      description: Tool or action not found
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
    '503':
      description: Toolset not configured
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string

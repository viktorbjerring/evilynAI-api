get:
  summary: List projects (projects module)
  description: |
    Module admin route on the `projects` module. Returns every project folder
    with its one-line description (the first non-empty line of the project's
    `index.md`), sorted by name. Read-only.
  tags: [module-admin]
  security:
    - bearerAuth: []
  responses:
    '200':
      description: The projects and their descriptions
      content:
        application/json:
          schema:
            type: object
            required: [projects]
            properties:
              projects:
                type: array
                items:
                  type: object
                  required: [name, description]
                  properties:
                    name:
                      type: string
                    description:
                      type: string
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string

get:
  summary: List user-callable actions for a tool
  description: |
    Returns the actions that a user can invoke directly on this tool,
    bypassing the AI inference loop entirely. Each action includes its name
    and a JSON Schema object describing its parameters. Tools that don't
    implement user actions return an empty list.

    User actions are defined per-tool via `@user_action`-decorated methods.
    Currently implemented actions:

    **tasks**
    - `user_setup_oauth` — Run the Google OAuth flow and save the token to disk.
      No parameters required.

    **schedule**
    - `user_disable` — Remove a scheduled action by ID.
      Parameters: `schedule_id` (string)
    - `user_trigger` — Fire a scheduled action immediately, bypassing its
      scheduled time. Parameters: `schedule_id` (string)
  tags: [tools]
  security:
    - bearerAuth: []
  parameters:
    - name: tool_name
      in: path
      required: true
      schema:
        type: string
        example: "schedule"
  responses:
    '200':
      description: Available user actions
      content:
        application/json:
          schema:
            type: object
            required: [tool, actions]
            properties:
              tool:
                type: string
              actions:
                type: array
                items:
                  type: object
                  required: [name, parameters]
                  properties:
                    name:
                      type: string
                      example: "user_trigger"
                    parameters:
                      type: object
                      description: JSON Schema object describing the action's parameters.
                      required: [type, properties]
                      properties:
                        type:
                          type: string
                          enum: [object]
                        properties:
                          type: object
                          additionalProperties:
                            type: object
                            properties:
                              type:
                                type: string
                              description:
                                type: string
                        required:
                          type: array
                          items:
                            type: string
          examples:
            schedule:
              summary: Scheduler tool actions
              value:
                tool: schedule
                actions:
                  - name: user_disable
                    parameters:
                      type: object
                      properties:
                        schedule_id:
                          type: string
                          description: "The ID of the scheduled action to disable"
                      required: [schedule_id]
                  - name: user_trigger
                    parameters:
                      type: object
                      properties:
                        schedule_id:
                          type: string
                          description: "The ID of the scheduled action to fire immediately, bypassing its scheduled time"
                      required: [schedule_id]
            tasks:
              summary: Tasks tool actions
              value:
                tool: tasks
                actions:
                  - name: user_setup_oauth
                    parameters:
                      type: object
                      properties: {}
                      required: []
    '401':
      $ref: '../openapi.yaml#/components/responses/Unauthorized'
    '404':
      $ref: '../openapi.yaml#/components/responses/NotFound'

post:
  summary: Execute a user action on a tool directly
  description: |
    Invokes a user-defined action on the tool, bypassing AI inference and
    the action queue.

    Currently implemented actions:

    **tasks / user_setup_oauth** — Runs the Google OAuth flow and saves the
    resulting token to disk. No parameters required.

    **schedule / user_disable** — Removes a scheduled action.
    Required parameter: `schedule_id` (string).

    **schedule / user_trigger** — Fires a scheduled action immediately,
    bypassing its scheduled time.
    Required parameter: `schedule_id` (string).

    The response is a plain string message returned by the action.
  tags: [tools]
  security:
    - bearerAuth: []
  parameters:
    - name: tool_name
      in: path
      required: true
      schema:
        type: string
        example: "schedule"
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required: [action]
          properties:
            action:
              type: string
              description: Name of the user action to execute
              example: "user_trigger"
            parameters:
              type: object
              additionalProperties: true
              description: Action-specific parameters
              example:
                schedule_id: "abc123"
        examples:
          user_trigger:
            summary: Trigger a scheduled action immediately
            value:
              action: user_trigger
              parameters:
                schedule_id: "abc123"
          user_disable:
            summary: Disable a scheduled action
            value:
              action: user_disable
              parameters:
                schedule_id: "abc123"
          user_setup_oauth:
            summary: Run Google OAuth setup for the tasks tool
            value:
              action: user_setup_oauth
              parameters: {}
  responses:
    '200':
      description: Action result message
      content:
        application/json:
          schema:
            type: object
            required: [result]
            properties:
              result:
                type: string
                description: Human-readable result message from the action
                example: "Scheduled action abc123 fired immediately by user."
    '400':
      $ref: '../openapi.yaml#/components/responses/BadRequest'
    '401':
      $ref: '../openapi.yaml#/components/responses/Unauthorized'
    '404':
      $ref: '../openapi.yaml#/components/responses/NotFound'

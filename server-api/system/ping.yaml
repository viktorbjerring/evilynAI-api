get:
  summary: System health ping
  description: Simple liveness check for the system blueprint.
  tags: [system]
  security:
    - bearerAuth: []
  responses:
    '200':
      description: Service is alive
      content:
        application/json:
          schema:
            type: object
            required: [status, message]
            properties:
              status:
                type: string
                example: "ok"
              message:
                type: string
                example: "pong"
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string

post:
  summary: Inject a system message into the AI
  description: |
    Sends an arbitrary system-role message to the AI and triggers inference.
    Used by external tools and automation to surface events directly into the
    conversation context.
  tags: [system]
  security:
    - bearerAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required: [message]
          properties:
            message:
              type: string
              description: The system message to inject
              example: "Reminder: your meeting starts in 10 minutes."
  responses:
    '200':
      description: Message injected and AI responded
      content:
        application/json:
          schema:
            type: object
            required: [status, response]
            properties:
              status:
                type: string
                example: "success"
              response:
                type: string
                description: AI response text
    '400':
      description: Missing message field
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string

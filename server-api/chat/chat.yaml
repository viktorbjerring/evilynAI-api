post:
  summary: Send a message and receive an AI response
  description: |
    Accepts either JSON (text) or multipart/form-data (audio).

    **Text input:** send `Content-Type: application/json` with a `message` field.

    **Audio input:** send `Content-Type: multipart/form-data` with an `audio` file.
    The file is transcribed server-side via OpenAI Whisper. The transcription is
    returned in `input_transcription`.

    **Thinking mode:** an optional `thinking` flag requests a two-phase run — the
    assistant reasons (streaming `thinking` SSE events on the event stream) before
    producing her reply. It defaults to `false` (single-pass). For JSON send a
    boolean; for multipart send a `thinking` form field with a truthy string
    (`true`/`1`/`yes`/`on`). The reasoning is delivered only over SSE, never in
    this response.

    **Attachments:** an optional `attachments` array carries images and links
    alongside the message. Each entry is a tagged object — `{"type": "image",
    "media_type": ..., "data": <base64>}` or `{"type": "link", "url": ...}` —
    with an optional `id` that becomes the reference the assistant uses to ask
    for that attachment. When `id` is omitted (or collides with another) one is
    assigned: `image-1`, `link-1`, and so on.

    Attachments are **not** preprocessed server-side the way audio is
    transcribed. They are passed through to the AI system, which starts parsing
    them immediately but leaves it to the assistant whether to read the result
    at all. A message carrying attachments always runs two-phase, whatever
    `thinking` says.

    Either `message` or `attachments` must be present — a picture with no words
    is still a message. On multipart requests the same array is sent as an
    `attachments` form field holding its JSON.

    The response may include `audio_url` — a TTS response ID. Fetch the audio
    from `GET /api/tts/fetch/{audio_url}`.
  tags: [chat]
  security:
    - bearerAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          description: >
            At least one of `message` or `attachments` must be present.
          properties:
            message:
              type: string
              example: "Hey, how are you?"
            thinking:
              type: boolean
              default: false
              description: >
                When true, run two-phase inference: the assistant reasons
                (streaming `thinking` SSE events) before replying. Forced true
                when `attachments` is non-empty.
            attachments:
              type: array
              maxItems: 6
              description: >
                Images and links sent with the message. Parsing happens inside
                the AI system, not here.
              items:
                oneOf:
                  - $ref: '../openapi.yaml#/components/schemas/ImageAttachment'
                  - $ref: '../openapi.yaml#/components/schemas/LinkAttachment'
                discriminator:
                  propertyName: type
      multipart/form-data:
        schema:
          type: object
          required: [audio]
          properties:
            audio:
              type: string
              format: binary
              description: Audio file (webm recommended)
            thinking:
              type: string
              enum: ["true", "1", "yes", "on", "false", "0", "no", "off"]
              default: "false"
              description: >
                Truthy string enables two-phase (thinking) inference for this
                voice message; omitted or falsy runs single-pass.
            attachments:
              type: string
              description: >
                The same attachments array as the JSON body, serialised as a
                JSON string — one payload shape across both transports.
              example: '[{"type": "link", "url": "https://example.com/x"}]'
  responses:
    '202':
      description: |
        Message accepted for asynchronous processing. The endpoint returns
        immediately; the assistant reply — and any `thinking` reasoning — is
        delivered later over the SSE stream, not in this response.
      content:
        application/json:
          schema:
            type: object
            required: [status]
            properties:
              status:
                type: string
                example: accepted
              input_transcription:
                type: string
                nullable: true
                description: Whisper transcription (only present for audio input)
              attachments:
                type: integer
                description: How many attachments were accepted from this request.
    '400':
      description: |
        Neither a message nor any attachments were supplied, or an attachment
        was malformed — an unknown `type`, invalid base64, a missing
        `media_type`, a non-http(s) URL, an image over the size limit, or more
        than six attachments. The `error` string names the offending entry by
        index.
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
    '500':
      description: Internal error during message processing
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string

get:
  summary: Get weekly memory-consolidation last-run status
  description: |
    Returns the outcome of the most recent long-term-memory reprocessing pass
    (tier 2 consolidation). `last_status` is `"never"` if the pass has never
    run. `last_result` carries the run's own statistics and is `null` when the
    pass has never run or ended in an error.
  tags: [debug]
  security:
    - bearerAuth: []
  responses:
    '200':
      description: Reprocess status
      content:
        application/json:
          schema:
            type: object
            required: [last_status]
            properties:
              last_run:
                type: string
                format: date-time
                nullable: true
                description: ISO timestamp of the last completed run, or null if never run
              last_status:
                type: string
                enum: [never, ok, error]
                description: >
                  Outcome of the last run. `"ok"` means the pass returned
                  without raising; it does NOT guarantee the queue was fully
                  drained — a run that stopped early on the broken-judge guard
                  also reports `"ok"`. Check `last_result.aborted` to
                  distinguish a full drain from an early bail-out.
              last_result:
                type: object
                nullable: true
                description: Statistics from the last successful run
                properties:
                  pivots:
                    type: integer
                    description: Memories examined as the pivot of an iteration
                  judgements:
                    type: integer
                    description: Pairwise judge calls made across all pivots
                  merges:
                    type: integer
                    description: Pairs collapsed into a newly synthesised memory
                  supersessions:
                    type: integer
                    description: Pairs where one memory superseded the other
                  complement:
                    type: integer
                    description: Verdicts that kept both memories as distinct facts
                  unknown:
                    type: integer
                    description: >
                      Verdicts the judge could not reach or parse; a high share
                      relative to `judgements` indicates a broken judge
                  floored:
                    type: integer
                    description: >
                      Merge/supersede verdicts refused by the collapse floor
                      (`merge_min_similarity`) because the pair's similarity was
                      too low to act on; a high count suggests lowering the floor
                  settled:
                    type: integer
                    description: Pivots that found no merge/supersede partner
                  errors:
                    type: integer
                    description: Pivots settled because merge synthesis failed
                  aborted:
                    type: boolean
                    description: >
                      True if the run stopped early because the unknown-verdict
                      rate crossed the broken-judge abort threshold
                  remaining:
                    type: integer
                    description: >
                      Memories still queued for reprocessing. Includes nodes
                      deferred to the next run, so a clean run in which any
                      merge or supersede occurred reports a non-zero value; it
                      is non-zero *without* any collapse only when the run hit
                      its iteration cap or aborted early.
                  active_before:
                    type: integer
                    description: Live (non-superseded) memories before the run
                  active_after:
                    type: integer
                    description: Live (non-superseded) memories after the run
    '401':
      $ref: '../../openapi.yaml#/components/responses/Unauthorized'

openapi: "3.0.3"

info:
  title: EvilynAI API
  version: "1.0.0"
  description: |
    REST API for the EvilynAI backend. Endpoints require a Bearer JWT token
    obtained from `POST /api/auth/login`, with three exceptions: `/health`,
    `/auth/login`, and `POST /birds/reports` — the yard detector's statistics
    upload, which presents a shared secret in `X-Corvus-Key` (the `corvusKey`
    scheme) instead. That route is machine-to-machine: the detector is not a
    person and does not hold the human credential the rest of the API uses.

    The SSE stream endpoint (`GET /api/stream`) also accepts the token as a
    `?token=` query parameter, because `EventSource` cannot set custom headers.

servers:
  - url: http://localhost:5000/api
    description: Local development

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

    # Machine-to-machine credential for the yard detector's statistics upload,
    # and nothing else. The detector is not a person and must not be made to
    # hold the human bearer token that reaches every other route; this key
    # opens exactly one endpoint. Unset on the server means that endpoint
    # answers 503 rather than accepting anything.
    corvusKey:
      type: apiKey
      in: header
      name: X-Corvus-Key

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          example: "Action not found"

    AdminActionParam:
      type: object
      description: >-
        One parameter of a declared admin action (`AdminAction.parameters`).
      required: [name, in, type, required, description]
      properties:
        name:
          type: string
        in:
          type: string
          enum: [path, query, body]
        type:
          type: string
          enum: [string, integer, number, boolean, array, object]
        required:
          type: boolean
        description:
          type: string
        default:
          description: Default value, if any, in the parameter's declared type.
        enum:
          type: array
          items:
            type: string
          description: Allowed values, if the parameter is constrained to a fixed set.
        example:
          description: Example value, if any, in the parameter's declared type.

    AdminAction:
      type: object
      description: >-
        A declared, self-describing module admin route -- one entry in the
        `/tools/admin-actions` manifest (also embedded per-tool as
        `admin_actions` on `GET /tools/{tool_name}`). This is a client
        rendering contract: it lets a client build admin UI from a
        machine-readable catalogue instead of hand-maintaining a hardcoded
        route list that drifts from the code.
      required:
        - tool
        - id
        - label
        - description
        - method
        - path
        - parameters
        - destructive
        - opens_url
        - order
      properties:
        tool:
          type: string
          example: "schedule"
        id:
          type: string
          description: Stable id, `<tool>.<view function name>`.
          example: "schedule.delete_schedule"
        label:
          type: string
          example: "Cancel schedule"
        description:
          type: string
        method:
          type: string
          enum: [GET, POST, PATCH, PUT, DELETE]
        path:
          type: string
          description: >-
            The route's URL, with `{name}` placeholders for path parameters
            (never Werkzeug `<converter:name>` syntax).
          example: "/api/tools/schedule/module/schedules/{schedule_id}"
        parameters:
          type: array
          items:
            $ref: '#/components/schemas/AdminActionParam'
        destructive:
          type: boolean
        confirm:
          type: string
          description: Confirmation copy to show the user. Only present when `destructive` is true.
        opens_url:
          type: boolean
          description: True if the response carries a URL the client should open.
        url_field:
          type: string
          description: Response field name holding the URL to open. Only present when `opens_url` is true.
          example: "authorization_url"
        group:
          type: string
          description: Optional section heading for grouping actions in a UI.
        order:
          type: integer
          description: Sort key within a tool (and group, if set).

    ActionStatus:
      type: string
      enum: [pending, approved, denied, executed, expired, error]

    ActionPermission:
      type: string
      enum: [immediate, requires_approval, disabled]

    QueuedAction:
      type: object
      required: [id, tool_name, parameters, created_at]
      properties:
        id:
          type: string
          format: uuid
        tool_name:
          type: string
        parameters:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/ActionStatus'

    ImageAttachment:
      type: object
      description: An image sent alongside a chat message.
      required: [type, media_type, data]
      properties:
        type:
          type: string
          enum: [image]
        media_type:
          type: string
          enum: [image/png, image/jpeg, image/gif, image/webp]
        data:
          type: string
          description: >-
            Base64-encoded image bytes. A `data:` URL is accepted and its
            prefix stripped. Capped at 8 MB decoded.
        id:
          type: string
          description: >-
            Optional short reference for this attachment, and the handle the
            assistant uses to ask for it. Assigned (`image-1`, `image-2`, ...)
            when omitted or when it collides with another on the same message.
            Not the storage id — that is minted server-side and is what the
            `/attachments` routes address the attachment by.
    LinkAttachment:
      type: object
      description: A URL sent alongside a chat message.
      required: [type, url]
      properties:
        type:
          type: string
          enum: [link]
        url:
          type: string
          format: uri
          description: An http(s) URL. Other schemes are rejected.
        id:
          type: string
          description: >-
            Optional reference for this attachment. Assigned (`link-1`,
            `link-2`, ...) when omitted or when it collides with another.
    ConfigSettings:
      type: object
      description: >-
        Editable AI-subsystem tuning settings, mirroring `AIConfig`. Used
        both as the full object (`GET /admin/config`, which reports the
        effective value of every field -- the persisted one, or the built-in
        default where the settings file is silent) and, on
        `PATCH /admin/config`, as a partial nested object containing only
        the fields to change.
      properties:
        inference:
          type: object
          description: >-
            Two-phase (thinking) inference prompt strings (`InferenceConfig`).
            The one section applied **live** by `PATCH /admin/config` -- the
            engine swaps these mid-flight, so prompt tuning needs no restart.
            Each string must be non-blank and at most 8000 characters.
          properties:
            thinking_suffix:
              type: string
              description: >-
                System-prompt suffix for the thinking phase. Frames the phase as
                private note-taking, and frames the exit as having nothing
                further to work out rather than being ready to reply.
            answer_suffix:
              type: string
              description: >-
                System-prompt suffix for the answer phase. Asserts that the
                final turn is Evilyn's own private reasoning, that the user has
                not seen any of it, and that the message she is about to write
                is the first thing they read. That assertion is correctness
                rather than tuning -- an override that drops it reintroduces the
                answer phase mistaking its reasoning for a delivered reply.
            answer_prompt:
              type: string
              description: >-
                The one-line imperative cue closing the answer phase's user
                turn, rendered immediately after the private-reasoning block.
                Keeps a compressed form of the not-yet-seen assertion, so
                overriding one of the two strings cannot remove it entirely.
                Must not be empty -- a bare block of notes with no instruction
                leaves the model to infer its task from the system prompt alone.
            attachment_nudge:
              type: string
              description: >-
                Template for the synthetic turn announcing an attachment, with
                `{kind}` (the attachment's noun) and `{reference}` (the id the
                tool action takes) slots; a template may use either, both, or
                neither. Unlike the other three strings this one frames a
                *choice*: worded as an instruction the assistant complies every
                time and the discretion the design rests on is gone. Reword it
                freely; keep it an offer. A template that cannot be formatted
                falls back to the built-in default.
        ltm:
          type: object
          description: Long-term memory tuning (`LTMConfig`).
          properties:
            vs_search_count:
              type: integer
              minimum: 1
              description: Number of candidates pulled from the vector store per retrieval.
            wm_max_size:
              type: integer
              minimum: 1
              description: Maximum number of memories held in the working set.
            wm_injection_count:
              type: integer
              minimum: 1
              description: Number of working-set memories injected into the system context per turn.
            decay_half_life_hours:
              type: number
              exclusiveMinimum: 0
              description: Half-life, in hours, of working-set relevance decay.
            min_score:
              type: number
              minimum: 0
              maximum: 1
              description: Minimum relevance score for a memory to remain in the working set.
            short_message_min_words:
              type: integer
              minimum: 0
              description: Minimum word count for a message to trigger retrieval.
            reconciliation_similarity_threshold:
              type: number
              minimum: 0
              maximum: 1
              description: Similarity threshold above which a new memory candidate is reconciled against an existing one.
        personality:
          type: object
          description: Personality trait store tuning (`PersonalityConfig`).
          properties:
            min_confidence:
              type: number
              minimum: 0
              maximum: 1
              description: Minimum confidence for a trait to be surfaced.
            merge_similarity_threshold:
              type: number
              minimum: 0
              maximum: 1
              description: Similarity threshold above which two traits are merged during normalisation.
            stale_days_decay_start:
              type: integer
              minimum: 0
              description: Days since last reinforcement before a trait's confidence starts decaying.
            stale_days_drop_floor:
              type: integer
              minimum: 0
              description: Days since last reinforcement after which a trait becomes eligible for dropping.
            drop_confidence_floor:
              type: number
              minimum: 0
              maximum: 1
              description: Confidence below which a stale trait is dropped.
        short_term:
          type: object
          description: Short-term memory tuning (`ShortTermConfig`).
          properties:
            transcript:
              type: object
              description: Transcript buffer tuning (`TranscriptConfig`).
              properties:
                max_tokens:
                  type: integer
                  minimum: 1
                  description: Token budget for the transcript buffer before rotation.
                summarization_threshold:
                  type: number
                  minimum: 0
                  maximum: 1
                  description: Fraction of `max_tokens` at which rotation (summarisation) is triggered.
                extraction_token_min:
                  type: integer
                  minimum: 0
                  description: Minimum token count of the rotated-out window for it to be summarised.
            summarizer:
              type: object
              description: Rolling summariser tuning (`SummarizerConfig`).
              properties:
                window_size:
                  type: integer
                  minimum: 1
                  description: Number of summaries merged into the meta-summary at a time.
                max_summaries:
                  type: integer
                  minimum: 1
                  description: Maximum number of rolling summaries retained before merging.
        scheduler:
          type: object
          description: Internal nightly dream scheduler tuning.
          properties:
            enabled:
              type: boolean
              description: Whether the nightly dream scheduler runs at all.
            schedule_hour:
              type: integer
              minimum: 0
              maximum: 23
              description: Local hour (0-23) at which the nightly dream pipeline fires.
            schedule_minute:
              type: integer
              minimum: 0
              maximum: 59
              description: Local minute (0-59) at which the nightly dream pipeline fires.
            catchup_on_boot:
              type: boolean
              description: Whether a missed nightly run fires immediately on server boot.
      example:
        inference:
          answer_prompt: >-
            Those were your private notes, which the user has not seen. Now
            write your actual response to them, as Evilyn.
        ltm:
          vs_search_count: 10
          wm_max_size: 40
          wm_injection_count: 8
          decay_half_life_hours: 72
          min_score: 0.15
          short_message_min_words: 4
          reconciliation_similarity_threshold: 0.85
        personality:
          min_confidence: 0.3
          merge_similarity_threshold: 0.85
          stale_days_decay_start: 14
          stale_days_drop_floor: 60
          drop_confidence_floor: 0.1
        short_term:
          transcript:
            max_tokens: 4000
            summarization_threshold: 0.8
            extraction_token_min: 200
          summarizer:
            window_size: 5
            max_summaries: 20
        scheduler:
          enabled: true
          schedule_hour: 3
          schedule_minute: 30
          catchup_on_boot: true

    TasksConnectionState:
      type: object
      required: [backend, connected, authenticated, last_checked, error]
      properties:
        backend:
          type: string
          enum: [local, google]
          description: >-
            Active backend from the last connection probe. 'google' when the
            live Google Tasks backend is reachable, otherwise 'local'.
        connected:
          type: boolean
          description: Whether the last probe reached the Google Tasks backend.
        authenticated:
          type: boolean
          description: True if a Google OAuth token is present on disk.
        last_checked:
          type: string
          format: date-time
          nullable: true
          description: ISO-8601 timestamp of the last probe, or null if never run.
        error:
          type: string
          nullable: true
          description: Reason the backend was unreachable, if any.

    FilmstripSummary:
      type: object
      description: >-
        One bird track as it appears in a listing — enough to render a card and
        pick the next thing to decide.
      required:
        [reference, track_id, date, event_id, camera_id, frames_in_track,
         frames_shown, span_seconds, first_utc, last_utc, detector_class,
         best_long_axis_px, hero, hero_url, has_contact, decided]
      properties:
        reference:
          type: string
          description: >-
            How this filmstrip is addressed — the track id with `#` replaced by
            `__`, since `#` is a URL fragment delimiter and a shell footgun.
          example: "cam0-20260819T065336Z-8c27__t004"
        track_id:
          type: string
          description: >-
            The unmodified track id, as the detector wrote it. Always take it
            from here rather than parsing it back out of `reference`.
          example: "cam0-20260819T065336Z-8c27#t004"
        date:
          type: string
          description: >-
            The UTC date of the track's first frame. It exists to keep directory
            sizes sane on the detector and carries no other meaning.
          example: "2026-08-19"
        event_id:
          type: string
          description: The detection event this passage belongs to.
        camera_id:
          type: string
          example: "cam0"
        frames_in_track:
          type: integer
          description: Frames in the whole passage.
          example: 18
        frames_shown:
          type: integer
          description: >-
            Frames in the sample the detector sent (up to nine). It differs from
            `frames_in_track`, and the difference is worth showing.
          example: 9
        span_seconds:
          type: number
          description: How long the passage lasted.
        first_utc:
          type: string
          format: date-time
        last_utc:
          type: string
          format: date-time
        detector_class:
          type: string
          description: >-
            A COCO stand-in's guess on a class-agnostic head. **Not truth, and
            must not be pre-selected in a UI** — treating it as a default would
            launder its errors into the training set. Context only.
          example: "bird"
        best_long_axis_px:
          type: number
        hero:
          type: string
          description: >-
            The frame the detector ranked best. A suggestion for what to show
            first, not a constraint — the reviewer may decide from any frame.
          example: "05.jpg"
        hero_url:
          type: string
          description: Where to fetch the hero frame's pixels.
        has_contact:
          type: boolean
          description: >-
            Whether a pre-composed 3×3 contact sheet exists. It is a preview
            only — never evidence, and a label may not be recorded against it.
        decided:
          type: boolean
          description: >-
            Whether a verdict is waiting to be collected. False also covers
            "already collected": the detector removes a verdict once merged.

    FilmstripVerdict:
      type: object
      description: >-
        One decision about one bird track, in the shape the detector consumes.
      required:
        [schema, track_id, verdict_id, decided_utc, decided_by, client,
         decided_from, scope, group, species, action, attributes, note, frames,
         split_after]
      properties:
        schema:
          type: integer
        track_id:
          type: string
          example: "cam0-20260819T065336Z-8c27#t004"
        verdict_id:
          type: string
          description: >-
            Stable unique string, used for idempotent merges — a repeat of the
            same id is a no-op on the detector's side.
        decided_utc:
          type: string
          format: date-time
        decided_by:
          type: string
        client:
          type: string
          description: What recorded the decision.
          example: "evilyn-server/1.4.0"
        decided_from:
          type: string
          description: >-
            The frame the call was made from. It determines label provenance:
            that record is marked as seen by a human, every other record in the
            passage as propagated.
          example: "05.jpg"
        scope:
          type: string
          enum: [track, frame]
        group:
          type: string
          nullable: true
        species:
          type: string
          nullable: true
        action:
          type: string
          nullable: true
        attributes:
          type: object
          additionalProperties: true
        note:
          type: string
          nullable: true
        frames:
          type: array
          nullable: true
          items:
            type: string
          description: >-
            `record_id`s, when `scope` is `frame`. Null otherwise — the detector
            ignores them there.
        split_after:
          type: string
          nullable: true
          description: >-
            A `record_id`: the track is visibly two animals and should be cut
            after that record.

  responses:
    Unauthorized:
      description: Missing or invalid JWT token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: "Missing token"

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    BadRequest:
      description: Invalid or missing request body
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

# The paths map is generated from the server-api/ folder tree by
# scripts/build_api_docs.py (run via `make build-api-docs`). Each `.yaml`
# file's location is its URL: `a/b/c.yaml` -> `/a/b/c`, and the index form
# `a/b/c/c.yaml` -> `/a/b/c` lets a route also have child folders. To add an
# endpoint, drop in one file -- this section never changes.
paths:
  $ref: ./_paths.generated.yaml

get:
  summary: Retrieve recent conversation messages
  description: |
    Returns messages from the current in-memory transcript in chronological
    order. The transcript is a rolling buffer; messages older than the buffer
    window are summarized and not returned here.
  tags: [chat]
  security:
    - bearerAuth: []
  parameters:
    - name: limit
      in: query
      required: false
      schema:
        type: integer
        default: 50
        minimum: 1
      description: Maximum number of messages to return (most recent N)
  responses:
    '200':
      description: Message list
      content:
        application/json:
          schema:
            type: object
            required: [messages]
            properties:
              messages:
                type: array
                items:
                  type: object
                  properties:
                    role:
                      type: string
                      enum: [user, assistant, system, tool_call, tool_result]
                      description: Clients should tolerate and ignore tool_call/tool_result roles
                    content:
                      type: string
                    timestamp:
                      type: string
                      format: date-time
                      nullable: true
                    feedback_flag:
                      type: string
                      enum: [undecided, encouraged, discouraged]
                      description: |
                        Reinforcement signal carried on the message. Only
                        assistant messages are ever marked; everything else
                        is `undecided`. Set via `POST /chat/feedback`.
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string

get:
  summary: Fetch generated TTS audio
  description: |
    Returns the MP3 audio for a given TTS response ID. The ID comes from the
    `audio_url` field of a `POST /api/chat` response.

    If the audio is still being generated, a `202` is returned with a
    `retry_after` hint (seconds). Poll again after that interval.
  tags: [tts]
  security:
    - bearerAuth: []
  parameters:
    - name: response_id
      in: path
      required: true
      schema:
        type: string
      description: TTS response ID from the chat response's `audio_url` field
  responses:
    '200':
      description: Audio file
      content:
        audio/mpeg:
          schema:
            type: string
            format: binary
    '202':
      description: Audio still generating — retry after the suggested interval
      content:
        application/json:
          schema:
            type: object
            required: [status, retry_after]
            properties:
              status:
                type: string
                example: "generating"
              retry_after:
                type: integer
                description: Suggested seconds to wait before retrying
                example: 1
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
    '404':
      description: Audio not found or expired
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
    '500':
      description: TTS generation failed
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
    '503':
      description: TTS engine not available
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string

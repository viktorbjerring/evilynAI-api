get:
  summary: Get current AI subsystem config
  description: |
    Returns the **effective** editable AI subsystem tuning settings (see
    `AIConfig`): for every field in the editable allowlist, the value persisted
    in the server's `AI_SETTINGS` JSON file, or the built-in default where the
    file is silent.

    That distinction matters for the `inference` prompt strings, which are
    usually defaults — a read that reported only what happens to be persisted
    would show them as absent and be useless for tuning.
  tags: [admin]
  security:
    - bearerAuth: []
  responses:
    '200':
      description: Current config
      content:
        application/json:
          schema:
            type: object
            required: [config, restart_required]
            properties:
              config:
                $ref: '../openapi.yaml#/components/schemas/ConfigSettings'
              restart_required:
                type: boolean
                enum: [false]
                description: >-
                  Always `false` for `GET` — included for symmetry with the
                  `PATCH` response shape.
    '401':
      $ref: '../openapi.yaml#/components/responses/Unauthorized'

patch:
  summary: Update AI subsystem config
  description: |
    Validates and persists a partial update to the `AI_SETTINGS` JSON file.
    The request body is a partial nested object of the same shape as
    `ConfigSettings`: only the fields being changed need to be present, and
    they are merged into the existing settings.

    Applying is **per section**. Every patch is written to disk; in addition,
    the `inference` section is handed straight to the running AI subsystem —
    its prompt strings are a plain dataclass the engine can swap mid-flight, so
    prompt tuning takes effect immediately and a run already in progress
    finishes on the old values. Every other section stays disk-only and takes
    effect on the next server restart.

    The response reports both sides: `applied_sections` are the sections that
    went live, `restart_sections` those still awaiting a restart. `applied` is
    `true` when at least one section went live; `restart_required` is `true`
    while any touched section still needs a restart. So a pure `inference`
    patch reports `applied: true, restart_required: false`, a mixed patch
    reports both `true`, and an empty (no-op) patch reports both `false`.

    A live-appliable section whose subsystem is unavailable — no inference
    engine, i.e. the server was started without tools — is reported as *not*
    applied and falls back into `restart_sections`.
  tags: [admin]
  security:
    - bearerAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../openapi.yaml#/components/schemas/ConfigSettings'
        example:
          inference:
            answer_prompt: >-
              Those were your private notes, which the user has not seen. Now
              write your actual response to them, as Evilyn.
          short_term:
            transcript:
              max_tokens: 4000
  responses:
    '200':
      description: >-
        Update validated and persisted to the `AI_SETTINGS` file, and applied
        live for every live-appliable section it touched.
      content:
        application/json:
          schema:
            type: object
            required:
              - applied
              - restart_required
              - applied_sections
              - restart_sections
              - updated
            properties:
              applied:
                type: boolean
                description: >-
                  `true` when at least one touched section was applied to the
                  running process (today: `inference`).
              restart_required:
                type: boolean
                description: >-
                  `true` while any touched section is still disk-only and needs
                  a restart to take effect.
              applied_sections:
                type: array
                description: Sections applied to the running process, sorted.
                items:
                  type: string
                example: [inference]
              restart_sections:
                type: array
                description: Touched sections that still need a restart, sorted.
                items:
                  type: string
                example: [short_term]
              updated:
                allOf:
                  - $ref: '../openapi.yaml#/components/schemas/ConfigSettings'
                description: The full settings object after merging in this update.
    '400':
      description: One or more fields are unknown, out of range, or the wrong type.
      content:
        application/json:
          schema:
            type: object
            required: [errors]
            properties:
              errors:
                type: array
                items:
                  type: string
                example:
                  - "Unknown field: 'ltm.bogus_field'"
                  - "'scheduler.schedule_hour' must be between 0 and 23"
                  - "inference.answer_prompt must not be blank"
    '401':
      $ref: '../openapi.yaml#/components/responses/Unauthorized'
    '409':
      description: No `AI_SETTINGS` file is configured on the server, so there is nowhere to persist the update.
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/Error'
          example:
            error: "No AI_SETTINGS file configured"

get:
  summary: Get a tool's current runtime state
  description: |
    Returns the tool's internal state as reported by `get_state()`. The
    structure is tool-specific — tools that don't override `get_state()`
    return an empty object.

    Example uses:
    - Scheduler: list of active scheduled jobs
    - Notebook: list of notes on disk
    - Tasks: cached task list from Google Tasks
  tags: [tools]
  security:
    - bearerAuth: []
  parameters:
    - name: tool_name
      in: path
      required: true
      schema:
        type: string
        example: "scheduler"
  responses:
    '200':
      description: Tool state
      content:
        application/json:
          schema:
            type: object
            required: [tool, state]
            properties:
              tool:
                type: string
              state:
                type: object
                additionalProperties: true
                description: Tool-specific state dictionary
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
    '404':
      description: Tool not found
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string

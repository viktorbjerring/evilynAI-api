openapi: "3.0.3"

info:
  title: EvilynAI API
  version: "1.0.0"
  description: |
    REST API for the EvilynAI backend. All endpoints except `/health` and
    `/auth/login` require a Bearer JWT token obtained from `POST /api/auth/login`.

    The SSE stream endpoint (`GET /api/stream`) also accepts the token as a
    `?token=` query parameter, because `EventSource` cannot set custom headers.

servers:
  - url: http://localhost:5000/api
    description: Local development

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          example: "Action not found"

    ActionStatus:
      type: string
      enum: [pending, approved, denied, executed, expired, error]

    ActionPermission:
      type: string
      enum: [immediate, requires_approval, disabled]

    QueuedAction:
      type: object
      required: [id, tool_name, parameters, created_at]
      properties:
        id:
          type: string
          format: uuid
        tool_name:
          type: string
        parameters:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/ActionStatus'

    TasksConnectionState:
      type: object
      required: [backend, connected, authenticated, last_checked, error]
      properties:
        backend:
          type: string
          enum: [local, google]
          description: >-
            Active backend from the last connection probe. 'google' when the
            live Google Tasks backend is reachable, otherwise 'local'.
        connected:
          type: boolean
          description: Whether the last probe reached the Google Tasks backend.
        authenticated:
          type: boolean
          description: True if a Google OAuth token is present on disk.
        last_checked:
          type: string
          format: date-time
          nullable: true
          description: ISO-8601 timestamp of the last probe, or null if never run.
        error:
          type: string
          nullable: true
          description: Reason the backend was unreachable, if any.

  responses:
    Unauthorized:
      description: Missing or invalid JWT token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: "Missing token"

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    BadRequest:
      description: Invalid or missing request body
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

# The paths map is generated from the server-api/ folder tree by
# scripts/build_api_docs.py (run via `make build-api-docs`). Each `.yaml`
# file's location is its URL: `a/b/c.yaml` -> `/a/b/c`, and the index form
# `a/b/c/c.yaml` -> `/a/b/c` lets a route also have child folders. To add an
# endpoint, drop in one file -- this section never changes.
paths:
  $ref: ./_paths.generated.yaml

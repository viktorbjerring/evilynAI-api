get:
  summary: Get full detail for a tool
  description: |
    Returns the tool's metadata, all its actions with their full JSON Schema
    parameter definitions, and the effective permission for each action
    (including any active overrides).

    `description` is the effective AI-facing text and `default_description` is
    what is declared in source — reported both for the tool and for each of its
    actions. Use `POST /tools/descriptions` to change either.
  tags: [tools]
  security:
    - bearerAuth: []
  parameters:
    - name: tool_name
      in: path
      required: true
      schema:
        type: string
        example: "notebook"
  responses:
    '200':
      description: Tool detail
      content:
        application/json:
          schema:
            type: object
            required: [name, enabled, actions, admin_actions]
            properties:
              name:
                type: string
              description:
                type: string
                nullable: true
                description: Effective AI-facing description (override applied)
              default_description:
                type: string
                nullable: true
                description: Description declared in the tool's source
              description_overridden:
                type: boolean
                description: True when a description override is active
              enabled:
                type: boolean
                nullable: true
              actions:
                type: array
                items:
                  type: object
                  required: [name, description, permission, overridden]
                  properties:
                    name:
                      type: string
                      example: "notebook_write"
                    action_name:
                      type: string
                      description: Short action name, as used by the override endpoints
                      example: "write"
                    description:
                      type: string
                      description: Effective action description (override applied)
                    default_description:
                      type: string
                      description: Description declared in source
                    description_overridden:
                      type: boolean
                      description: >-
                        True when this action's description has been
                        overridden (see `POST /tools/descriptions`)
                    parameters:
                      type: object
                      additionalProperties: true
                      description: JSON Schema for the action's parameters
                    permission:
                      type: string
                      enum: [immediate, requires_approval, disabled, system_only]
                      description: >-
                        Effective permission (default or overridden). Every
                        action is listed, including hidden `disabled` /
                        `system_only` ones.
                    default_permission:
                      type: string
                      enum: [immediate, requires_approval, disabled, system_only]
                      description: Permission declared in source
                    overridden:
                      type: boolean
                      description: True if the permission has been manually overridden
              admin_actions:
                type: array
                description: >-
                  This tool's declared admin actions -- the same entries
                  returned for this tool by `GET /tools/admin-actions`.
                  Independent of `enabled`: present even for a disabled tool,
                  since its module blueprint stays mounted either way.
                items:
                  $ref: '../../openapi.yaml#/components/schemas/AdminAction'
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
    '404':
      description: Tool not found
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: "Tool 'unknown_tool' not found"
